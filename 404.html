<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0e141c" />
    <meta name="color-scheme" content="dark" />
    <title>Pocket Reserve · Missing page</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230e141c'/%3E%3Ccircle cx='32' cy='32' r='19' fill='none' stroke='%23d7b56a' stroke-width='4'/%3E%3Cpath d='M32 18c6 4 9 9 9 14a9 9 0 0 1-18 0c0-5 3-10 9-14z' fill='%23f3e2b0'/%3E%3C/svg%3E" />
    <style>
      /* Everything is inline: this page is served for any missing address, at any depth, so it cannot rely on a relative file. */
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html { background: #0e141c; }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        color: #f6efe0;
        font: 700 17px/1.45 'Nunito Variable', Nunito, system-ui, -apple-system, 'Segoe UI', sans-serif;
        background-color: #0e141c;
        background-image: linear-gradient(180deg, #1c2733 0%, #0e141c 46%, #0a0f15 100%);
      }
      main {
        position: relative;
        isolation: isolate;
        width: min(460px, 100%);
        padding: 36px 32px 32px;
        text-align: center;
        background-color: #0e141c;
        background-image:
          linear-gradient(rgba(215, 181, 106, 0.8), rgba(215, 181, 106, 0.8)), linear-gradient(rgba(215, 181, 106, 0.8), rgba(215, 181, 106, 0.8)),
          linear-gradient(rgba(215, 181, 106, 0.8), rgba(215, 181, 106, 0.8)), linear-gradient(rgba(215, 181, 106, 0.8), rgba(215, 181, 106, 0.8)),
          linear-gradient(rgba(215, 181, 106, 0.8), rgba(215, 181, 106, 0.8)), linear-gradient(rgba(215, 181, 106, 0.8), rgba(215, 181, 106, 0.8)),
          linear-gradient(rgba(215, 181, 106, 0.8), rgba(215, 181, 106, 0.8)), linear-gradient(rgba(215, 181, 106, 0.8), rgba(215, 181, 106, 0.8)),
          linear-gradient(180deg, #1c2733 0%, #0e141c 46%, #0a0f15 100%);
        background-size: 8px 1px, 1px 8px, 8px 1px, 1px 8px, 8px 1px, 1px 8px, 8px 1px, 1px 8px, 100% 100%;
        background-position: left 5px top 5px, left 5px top 5px, right 5px top 5px, right 5px top 5px, left 5px bottom 5px, left 5px bottom 5px, right 5px bottom 5px, right 5px bottom 5px, 0 0;
        background-repeat: no-repeat;
        border: 1px solid #c8a86a;
        border-top-color: #f3e2b0;
        border-bottom-color: #6b4a0e;
        border-radius: 12px;
        box-shadow:
          inset 0 0 0 2px rgba(7, 11, 16, 0.78), inset 0 0 0 3px rgba(215, 181, 106, 0.3),
          0 0 0 1px #8a6528, 0 0 0 2px #2a1d0a, 0 3px 6px rgba(0, 0, 0, 0.35), 0 14px 30px rgba(0, 0, 0, 0.5);
      }
      .mark {
        width: 44px;
        height: 44px;
        margin: 0 auto 14px;
        display: grid;
        place-items: center;
        color: #d7b56a;
        border-radius: 50%;
        border: 1px solid #c8a86a;
        background: radial-gradient(circle at 35% 30%, #2f3c4b, #0a1018 72%);
        box-shadow: inset 0 1px 0 rgba(243, 226, 176, 0.4), 0 0 0 1px #2a1d0a;
      }
      .kicker {
        margin: 0 0 8px;
        color: #f3e2b0;
        font: 700 14px/1.2 'Cormorant Garamond', 'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, serif;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0 0 6px;
        font: 700 34px/1.08 'Cormorant Garamond', 'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, serif;
        color: #f6efe0;
      }
      .rule { height: 1px; margin: 16px 0 22px; background: linear-gradient(90deg, transparent, #d7b56a 15%, #f3e2b0 50%, #d7b56a 85%, transparent); }
      a {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 52px;
        padding: 10px 18px;
        color: #1a1208;
        font-weight: 800;
        font-size: 18px;
        text-decoration: none;
        background-color: #c9a24f;
        background-image: linear-gradient(180deg, #ecd28a 0%, #c9a24f 52%, #b08a38 100%);
        border: 1px solid #6b4a0e;
        border-top-color: #f6e6b4;
        border-radius: 12px;
        box-shadow: inset 0 1px 0 rgba(255, 248, 220, 0.55), inset 0 -2px 0 rgba(90, 60, 10, 0.3), 0 1px 0 #2a1d0a, 0 3px 6px rgba(0, 0, 0, 0.4);
      }
      a:focus-visible { outline: 2px solid #f3e2b0; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="24" height="24" focusable="false"><circle cx="12" cy="12" r="9.4" fill="none" stroke="currentColor" stroke-width="1.8" /><path d="M12 6.3c2.5 1.8 3.8 3.9 3.8 5.9A3.8 3.8 0 0 1 12 16a3.8 3.8 0 0 1-3.8-3.8c0-2 1.3-4.1 3.8-5.9z" fill="currentColor" /></svg>
      </div>
      <p class="kicker">Pocket Reserve</p>
      <h1>This path is not on the island.</h1>
      <div class="rule"></div>
      <a href="https://aapofoundation.github.io/pocket-reserve/">Back to Pocket Reserve</a>
    </main>
  </body>
</html>
